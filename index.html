<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Notebook</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>My Notebook</h1>
    <p id="session-status" class="status" aria-live="polite">Checking session…</p>
  </header>

  <div id="error" class="error" role="alert" hidden></div>
  <div id="info" class="info" role="status" hidden></div>

  <main>
    <!-- Signed out -->
    <section id="auth-section" hidden>
      <h2>Sign in or create an account</h2>
      <form id="auth-form" novalidate>
        <label>Email
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        </label>
        <div class="row">
          <button type="submit" id="sign-in-btn">Sign in</button>
          <button type="button" id="sign-up-btn" class="secondary">Sign up</button>
        </div>
      </form>
    </section>

    <!-- Signed in -->
    <section id="notes-section" hidden>
      <div class="row space-between">
        <h2>Your private notes</h2>
        <button type="button" id="sign-out-btn" class="secondary">Sign out</button>
      </div>

      <form id="new-note-form">
        <label for="new-note">New note</label>
        <textarea id="new-note" rows="3" maxlength="10000" required></textarea>
        <button type="submit">Add note</button>
      </form>

      <p id="notes-empty" class="muted" hidden>No notes yet.</p>
      <ul id="notes-list" class="notes"></ul>
    </section>
  </main>

  <!-- Supabase JS v2 (UMD build) from CDN — exposes window.supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
